name: roadly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: "^0.13.1"

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/roadlylogo2.jpg"  

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/

  fonts:
    - family: Serif
      fonts:
        - asset: lib/assets/fonts/DMSerifDisplay-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic