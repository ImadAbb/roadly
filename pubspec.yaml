name: roadly
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  smooth_page_indicator: ^2.0.1
  lottie: ^3.3.3
  keyboard_actions: ^4.2.1
  path_provider: ^2.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_icons:
  android: true
  ios: true
  image_path: "lib/assets/images/roadlylogo2.jpg"  

flutter:
  uses-material-design: true
  assets:
    - lib/assets/images/
    - lib/assets/lottie/

  fonts:
    - family: Serif
      fonts:
        - asset: lib/assets/fonts/DMSerifDisplay-Regular.ttf
          weight: 400
        - asset: lib/assets/fonts/DMSerifDisplay-Italic.ttf
          style: italic