name: Build and publish release

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: roadly-latest-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.lock') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: roadly-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Cache Flutter dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.pub-cache
            build
          key: ${{ runner.os }}-flutter-${{ hashFiles('pubspec.yaml') }}

      - name: Install dependencies
        run: flutter pub get

      - name: Build unsigned iOS app
        run: flutter build ios --no-codesign

      - name: Package into IPA format
        run: |
          mkdir -p Payload
          mv build/ios/iphoneos/Runner.app Payload/
          zip -r UnsignedApp.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-ios-ipa
          path: UnsignedApp.ipa

  publish-release:
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download build artifacts
        uses: actions/download-artifact@v7
        with:
          path: release-files

      - name: Create or update rolling release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            git tag --force latest "$GITHUB_SHA"
            git push --force origin refs/tags/latest
            gh release edit latest \
              --title "Latest build" \
              --notes "Builds generated automatically from the latest push to main." \
              --latest
          else
            gh release create latest \
              --target "$GITHUB_SHA" \
              --title "Latest build" \
              --notes "Builds generated automatically from the latest push to main." \
              --latest
          fi

          gh release upload latest \
            release-files/roadly-android-apk/app-release.apk \
            release-files/unsigned-ios-ipa/UnsignedApp.ipa \
            --clobber
